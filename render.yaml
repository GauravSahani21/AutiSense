services:
  - type: web
    name: autisense
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: NVIDIA_API_KEY
        sync: false
      - key: ML_API_URL
        value: http://localhost:5001
